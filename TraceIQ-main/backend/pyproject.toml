[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bugdiag"
version = "0.1.0"
description = "Intelligent Bug Diagnosis Platform with Fix Recommendation Assistance"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "BugDiag Contributors" }
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.4",
    "rank-bm25>=0.2.2",
    "pandas>=2.1.4",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.2",
    "python-multipart>=0.0.9",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.1",
    "pypdf>=4.0.0"
]

[project.optional-dependencies]
ml = [
    "torch>=2.2.0",
    "sentence-transformers>=2.3.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.2.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bugdiag*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Cupertino Deep Space) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Neural Trace Gradient (Apple Blue to Electric Cyan to Violet) -->
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF" />
      <stop offset="45%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#5856D6" />
    </linearGradient>

    <!-- Accent Glow Filter -->
    <filter id="iosGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Specular Highlight for Glass Feel -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- iOS Continuous Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.14)" stroke-width="2.5" />
  <rect x="16" y="16" width="480" height="240" rx="112" fill="url(#glassReflection)" />

  <!-- Subtle Ambient Diagnostic Radar Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(0, 122, 255, 0.15)" stroke-width="2" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="105" fill="none" stroke="rgba(0, 240, 255, 0.12)" stroke-width="1.5" />

  <!-- Stylized Geometric "T" + "IQ" Neural Trace Pulse -->
  <g filter="url(#iosGlow)">
    <!-- Top Horizontal Crossbar of T (Fast dynamic trace bar) -->
    <path d="M 130 160 C 130 148 140 138 152 138 L 360 138 C 372 138 382 148 382 160 C 382 172 372 182 360 182 L 152 182 C 140 182 130 172 130 160 Z" fill="url(#traceGrad)" />
    
    <!-- Central Vertical Stem of T (Stack trace spine) -->
    <path d="M 234 176 L 278 176 L 278 344 C 278 358 266 370 256 370 C 246 370 234 358 234 344 Z" fill="url(#traceGrad)" />

    <!-- Neural Cross-Branch / Diagnostic Vector Lines -->
    <path d="M 170 240 L 234 240" stroke="#00F0FF" stroke-width="8" stroke-linecap="round" />
    <path d="M 278 240 L 342 240" stroke="#5856D6" stroke-width="8" stroke-linecap="round" />
    <path d="M 195 295 L 234 295" stroke="#007AFF" stroke-width="6" stroke-linecap="round" />
    <path d="M 278 295 L 317 295" stroke="#00F0FF" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- IQ Focus Core Point (Radar Lock on Root Cause) -->
  <circle cx="256" cy="240" r="14" fill="#FFFFFF" />
  <circle cx="256" cy="240" r="7" fill="#007AFF" />
  <circle cx="342" cy="240" r="8" fill="#00F0FF" />
  <circle cx="170" cy="240" r="8" fill="#5856D6" />

  <!-- Bottom Pulse Point -->
  <circle cx="256" cy="370" r="9" fill="#00F0FF" />
</svg>